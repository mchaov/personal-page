<article class="article-abstract" data-article-card data-tags="{{TAG_SLUGS}}" data-year="{{YEAR}}" data-month="{{MONTH}}">
    <h2><a class="article-title" href="{{LINK}}">{{TITLE}}</a></h2>
    <div class="article-meta">
        <time datetime="{{DATE_ISO}}">{{DATE}}</time>
        {{TAGS}}
    </div>
    <p class="article-summary"><span class="article-summary-text">{{ABSTRACT}}</span></p>
</article>
